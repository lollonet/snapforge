name: Build iOS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-deps:
    name: Build C++ dependencies
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Cache vendor dependencies
        uses: actions/cache@v4
        with:
          path: |
            SnapClientCore/vendor/boost
            SnapClientCore/vendor/flac
            SnapClientCore/vendor/opus
            SnapClientCore/vendor/ogg
            SnapClientCore/vendor/snapcast
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Install build tools
        run: |
          brew install cmake autoconf automake libtool

      - name: Build dependencies
        run: ./scripts/build-deps.sh

      - name: Upload built libraries
        uses: actions/upload-artifact@v4
        with:
          name: ios-deps
          path: |
            build/deps/snapclient_core/Release-iphoneos/*.a
            SnapClientCore/vendor/*/lib/*.a
            SnapClientCore/vendor/*/include/**
          retention-days: 7

  build-app:
    name: Build iOS app
    runs-on: macos-14
    needs: build-deps
    steps:
      - uses: actions/checkout@v4

      - name: Download built libraries
        uses: actions/download-artifact@v4
        with:
          name: ios-deps

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build (xcodebuild)
        run: |
          xcodebuild build \
            -project SnapClient.xcodeproj \
            -scheme SnapClient \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

  lint:
    name: Swift lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict SnapClient/
